spring:
  application:
    name: jobportal

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobportal}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5175,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com,https://*.railway.app}

jwt:
  secret-key: ${JWT_SECRET_KEY:mySuperSecretKeyForJobPortalProjectKiwisoft123456}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO


